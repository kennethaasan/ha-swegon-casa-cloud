asyncapi: 3.1.0
id: urn:kennethaasan:ha-swegon-casa-cloud:mqtt
info:
  title: Swegon CASA mobile MQTT protocol (observed)
  version: 0.5.0
  description: |-
    Community-maintained AsyncAPI reference for the MQTT transport used by
    the Swegon CASA mobile cloud client and this Home Assistant integration.

    The protocol is not published as a supported Swegon consumer API. It was
    observed from the current integration and may change with the mobile app,
    cloud service, or ventilation-unit firmware. The message payload is a
    proprietary binary frame containing a little-endian header and a
    protobuf-like payload; the schemas below describe the observed wire layout,
    not a full vendor protobuf definition.

    MQTT application messages are bytes, not JSON. To read one, decode the
    first five bytes as little-endian <HHB (transaction, request type, protocol
    version), consume the 128-byte NUL-padded response topic on requests only,
    and parse the remaining bytes as protobuf-style fields. Wire type 0 is an
    unsigned varint and wire type 2 is a length-delimited field containing
    packed varints. Register values and mode values use zigzag encoding where
    explicitly noted below; the response status field does not.

    A step-by-step decoder with byte offsets and Python reference code is in
    docs/swegon-casa-mqtt-decoding.md. The integration implementation in
    custom_components/swegon_casa_cloud/mqtt.py remains the executable source
    of truth when the observed protocol and this document disagree.

    Temporary AWS IoT custom-authorizer values are deliberately represented
    only by their field names. Never put real endpoints, tokens, serial
    numbers, topics, or household identifiers in this file.
  contact:
    name: ha-swegon-casa-cloud community
    url: https://github.com/kennethaasan/ha-swegon-casa-cloud
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-integration-version: 0.5.0
  x-observed-at: 2026-09-03
  x-source-files:
    - custom_components/swegon_casa_cloud/mqtt.py
    - custom_components/swegon_casa_cloud/api.py
  externalDocs:
    description: AsyncAPI 3.1.0 specification
    url: https://github.com/asyncapi/spec/blob/master/spec/asyncapi.md
  x-decoder-guide: docs/swegon-casa-mqtt-decoding.md
  x-wire-format:
    payload_encoding: binary
    json_payload: false
    integer_encoding: unsigned_varint
    byte_order: little_endian
    frame_header:
      size_bytes: 5
      format: <HHB
      fields:
        - name: transaction
          offset: 0
          size_bytes: 2
          type: uint16
        - name: request_type
          offset: 2
          size_bytes: 2
          type: uint16
        - name: protocol_version
          offset: 4
          size_bytes: 1
          type: uint8
          observed_value: 1
    request_layout:
      - field: frame_header
        offset: 0
        size_bytes: 5
      - field: response_topic
        offset: 5
        size_bytes: 128
        encoding: latin-1
        padding: NUL bytes
      - field: protobuf_body
        offset: 133
        size_bytes: remaining
    response_layout:
      - field: frame_header
        offset: 0
        size_bytes: 5
      - field: protobuf_body
        offset: 5
        size_bytes: remaining
    protobuf_body:
      field_key: (field_number << 3) | wire_type
      supported_wire_types:
        '0': varint
        '2': length_delimited_packed_varints
      packed_field: length-delimited bytes containing consecutive varints
      unknown_fields: ignore only when the wire type can be safely skipped
defaultContentType: application/octet-stream
servers:
  casaAwsIot:
    host: '{endpoint}'
    pathname: /mqtt
    protocol: mqtt
    protocolVersion: '3.1.1'
    description: |-
      AWS IoT endpoint returned dynamically by the Swegon mobile summary
      endpoint. The endpoint variable must be replaced with
      connectionDetails.endpoint at runtime.
    variables:
      endpoint:
        default: example.invalid
        description: Dynamic endpoint from the authenticated mobile summary; never commit a real value.
    security:
      - $ref: '#/components/securitySchemes/awsIotCustomAuthorizer'
    bindings:
      mqtt:
        cleanSession: true
        keepAlive: 60
        bindingVersion: '0.2.0'
channels:
  casaRequests:
    address: up2020/{group}/{name}/req
    title: CASA gateway requests
    description: |-
      Requests sent to the ventilation unit gateway. The MQTT payload is a
      binary application frame, not a JSON document. The topic variables are
      taken from the authenticated mobile summary response.
    parameters:
      group:
        description: Value of thing.group returned by the mobile summary.
        examples: [redacted-group]
      name:
        description: Value of thing.name returned by the mobile summary.
        examples: [redacted-unit]
    messages:
      readRegisterRequest:
        $ref: '#/components/messages/readRegisterRequest'
      writeModeRequest:
        $ref: '#/components/messages/writeModeRequest'
  casaResponses:
    address: up2020/{group}/{name}/res/{clientUuid}
    title: CASA gateway responses
    description: |-
      Short-lived response topic created by the mobile client. The response
      payload is binary and does not repeat the 128-byte response-topic field;
      correlate it with the transaction and request type in the five-byte
      response header.
    parameters:
      group:
        description: Value of thing.group returned by the mobile summary.
        examples: [redacted-group]
      name:
        description: Value of thing.name returned by the mobile summary.
        examples: [redacted-unit]
      clientUuid:
        description: UUID generated by the MQTT client for the response topic.
        examples: [00000000-0000-4000-8000-000000000000]
    messages:
      gatewayResponse:
        $ref: '#/components/messages/gatewayResponse'
operations:
  sendReadRegister:
    action: send
    channel:
      $ref: '#/channels/casaRequests'
    messages:
      - $ref: '#/channels/casaRequests/messages/readRegisterRequest'
    description: Send a type-3 request to read one register and one value.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: '0.2.0'
  sendOperatingModeWrite:
    action: send
    channel:
      $ref: '#/channels/casaRequests'
    messages:
      - $ref: '#/channels/casaRequests/messages/writeModeRequest'
    description: Send the allow-listed operating-mode write used by the integration.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: '0.2.0'
  receiveGatewayResponse:
    action: receive
    channel:
      $ref: '#/channels/casaResponses'
    messages:
      - $ref: '#/channels/casaResponses/messages/gatewayResponse'
    description: Receive and correlate a response using the transaction field.
    bindings:
      mqtt:
        qos: 1
        bindingVersion: '0.2.0'
components:
  securitySchemes:
    awsIotCustomAuthorizer:
      type: httpApiKey
      name: X-Amz-CustomAuthorizer-Name
      in: header
      description: |-
        The WebSocket handshake uses the custom-authorizer name plus two
        additional dynamic headers. Their values come from the authenticated
        mobile summary and must never be logged or committed.
      x-handshake-headers:
        X-Amz-CustomAuthorizer-Name: connectionDetails.customAuthorizer
        dynamic-token-header: connectionDetails.tokenKeyName -> connectionDetails.token
        X-Amz-CustomAuthorizer-Signature: connectionDetails.tokenSignature
  messages:
    readRegisterRequest:
      name: ReadRegisterRequest
      title: Read one Swegon register
      summary: Proprietary binary register-read request.
      description: |-
        The integration constructs a frame with request type 3. The payload
        after the five-byte frame header is a protobuf-like packed field 1
        containing [register, quantity], with quantity set to 1. In a complete
        request frame, the 128-byte response topic is between the header and
        this body. For register 1039, the body is the illustrative hex sequence
        `0a 03 8f 08 01` (field 1, length 3, varint(1039), varint(1)).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/RawCasaFrame'
      x-wire-format:
        request_type: 3
        frame: header + response_topic[128] + body
        body: field 1, wire type 2, packed unsigned varints [register, 1]
        body_hex_example: 0a 03 8f 08 01
        decode_steps:
          - 0a = field 1, wire type 2
          - 03 = packed body length
          - 8f 08 = unsigned varint 1039
          - 01 = unsigned varint quantity 1
    writeModeRequest:
      name: WriteModeRequest
      title: Write operating mode
      summary: Proprietary binary operating-mode write request.
      description: |-
        The integration writes register 1039 only and verifies the resulting
        value by reading it back. Values are restricted to the allow-list in
        the repository constants. The message body is not a JSON object: it
        contains field 1 with the register number, field 2 with quantity 1,
        and field 3 with a packed zigzag-encoded mode value.
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/RawCasaFrame'
      x-wire-format:
        request_type: 2
        frame: header + response_topic[128] + body
        fields:
          field_1: wire type 0, register number 1039
          field_2: wire type 0, quantity 1
          field_3: wire type 2, packed zigzag-encoded mode value
        body_hex_example:
          boost_100: 08 8f 08 10 01 1a 02 c8 01
        decode_steps:
          - 08 8f 08 = field 1 and unsigned varint 1039
          - 10 01 = field 2 and quantity 1
          - 1a 02 c8 01 = field 3 and packed varint zigzag(100)
    gatewayResponse:
      name: GatewayResponse
      title: Swegon gateway response
      summary: Proprietary binary response frame.
      description: |-
        Responses start with the same five-byte frame header. The protobuf-like
        body contains a status field and, for register reads, packed values
        containing [register, quantity, value]. A successful read of register
        1039 returning value 65 may have the illustrative body
        `0a 05 9e 10 02 82 01 10 00`: field 1 contains zigzag-decoded values
        [1039, 1, 65], and field 2 is status 0. Field order should not be
        assumed; use field numbers.
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/RawCasaFrame'
      x-wire-format:
        response_header: transaction, request_type, protocol_version
        status_field: field 2, wire type 0, unsigned status code (0 = success)
        read_values_field: field 1, wire type 2, packed zigzag varints [register, quantity, value]
        response_correlation:
          transaction: must match the outstanding request
          request_type: must match the outstanding request
          protocol_version: observed value 1
        body_hex_example:
          read_1039_value_65: 0a 05 9e 10 02 82 01 10 00
        decode_steps:
          - 0a 05 = field 1, length-delimited packed body of 5 bytes
          - 9e 10 = zigzag-decoded register 1039
          - 02 = zigzag-decoded quantity 1
          - 82 01 = zigzag-decoded value 65
          - 10 00 = field 2 status 0
  schemas:
    RawCasaFrame:
      type: string
      format: byte
      description: Base64 representation of the complete raw MQTT binary frame; the wire format is not JSON.
    FrameHeader:
      type: object
      description: Logical view of the five-byte little-endian frame header.
      required: [transaction, request_type, protocol_version]
      properties:
        transaction:
          type: integer
          minimum: 0
          maximum: 65535
          description: uint16 little-endian correlation number.
        request_type:
          type: integer
          minimum: 0
          maximum: 65535
          description: Request/response operation type; 3 reads a register and 2 writes the operating mode.
        protocol_version:
          type: integer
          const: 1
          description: Observed protocol version byte.
    PackedVarints:
      type: array
      items:
        type: integer
      description: Logical representation of a wire type 2 packed field after its length and varints are decoded.
    ModeValues:
      type: object
      additionalProperties:
        type: integer
      example:
        travelling: 5
        away: 35
        home: 65
        home_plus: 80
        boost: 100
